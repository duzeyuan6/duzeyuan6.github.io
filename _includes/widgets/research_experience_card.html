<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">

                <h6 class="mb-3">
                    <i class="fas fa-flask"></i> Research Experience
                </h6>

                {% for item in site.data.research_experience %}

                <div class="mb-3">

                    <!-- Project Title -->
                    <div>
                        <strong>{{ item.title }}</strong>
                    </div>

                    <!-- Advisor -->
                    {% if item.advisor %}
                    <div class="small text-muted">
                        Advisor: {{ item.advisor }}
                    </div>
                    {% endif %}

                    <!-- Description -->
                    {% if item.description %}
                    <div class="small mt-1">
                        {{ item.description }}
                    </div>
                    {% endif %}

                    <!-- Optional Project Link -->
                    {% if item.link %}
                    <div class="small mt-1">
                        <a href="{{ item.link }}" target="_blank">
                            <i class="fas fa-external-link-alt"></i> Project Page
                        </a>
                    </div>
                    {% endif %}

                </div>

                {% endfor %}

            </div>
        </div>
    </div>
</div>
