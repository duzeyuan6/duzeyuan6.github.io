short_bio: >-
  <p>
    I am currently pursuing a master's degree in Robotics at the Graduate School of Engineering, 
    Tohoku University, where I conduct research at the Neuro-Robotics Lab.
    Prior to this, I received my B.Eng. in Automation and B.A. in Philosophy from Nankai University.
  </p>
  <p>
    In addition to my academic training, I am a remote Research Assistant at the 
    Language and Multimodal Intelligence Lab, University of Florida.
    Previously, I worked as a visiting Research Assistant at the Robotics and Intelligent Systems Lab, 
    HKUST(GZ).
  </p>
  <p>
    My research interests include robotics, embodied intelligence, human-robot interaction, 
    vision-language-action models, soft robotics, spiking neural networks, and brain-inspired control.
  </p>
  
